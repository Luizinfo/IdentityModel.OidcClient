on:
  workflow_dispatch:
  push:
    branches:
    - main
    - features/**
    - fix/**
    - release/**
    tags:
    - '*.*.*'
  pull_request:

env:
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-26-intel, ubuntu-latest, windows-latest]
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - run: dotnet --info
    
    - if: runner.os != 'Windows'
      run: ./build.sh
    - if: matrix.runs-on == 'windows-latest'
      run: ./build.cmd
